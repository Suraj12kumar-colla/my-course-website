<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pro Admin Panel</title>

<style>

body{
background:#111;
font-family:Arial;
color:white;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

input{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
padding:14px;
border:none;
border-radius:10px;
margin-top:15px;
cursor:pointer;
font-size:16px;
font-weight:bold;
}

.create-btn{
background:#39d0b1;
color:white;
width:100%;
}

.logout-btn{
background:red;
color:white;
width:100%;
}

.card{
background:#222;
padding:15px;
border-radius:14px;
margin-top:15px;
}

.action-btn{
background:#39d0b1;
color:white;
margin-right:10px;
}

.delete-btn{
background:red;
color:white;
}

</style>

</head>

<body>

<div class="container">

<h1>Admin Panel Pro</h1>

<button class="logout-btn" onclick="logoutAdmin()">
Logout
</button>

<h2>Create New Code</h2>

<input type="text" id="code" placeholder="Enter Code">

<input type="date" id="expiry">

<button class="create-btn" onclick="createCode()">
Create Code
</button>

<p id="status"></p>

<hr>

<h2>All Active Codes</h2>

<button class="create-btn" onclick="loadCodes()">
Refresh List
</button>

<div id="codesList"></div>

<hr>

<h2>Students Analytics</h2>

<button class="create-btn" onclick="loadUsers()">
Load Students
</button>

<div id="usersList"></div>

</div>

<script type="module" src="admin.js"></script>

<script>
window.addEventListener("load", () => {

setTimeout(() => {

if(typeof loadCodes === "function"){
loadCodes();
}

},1000);

});
</script>

</body>
</html>
