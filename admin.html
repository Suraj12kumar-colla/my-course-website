<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pro Admin Panel</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Admin Panel Pro</h1>

<h3>Create New Code</h3>

<input type="text" id="code" placeholder="Enter Code">

<input type="date" id="expiry">

<button onclick="createCode()">Create Code</button>

<p id="status"></p>

<hr>

<h3>All Active Codes</h3>

<button onclick="loadCodes()">Refresh List</button>

<div id="codesList"></div>

<hr>

<h2>Students Analytics</h2>

<button onclick="loadUsers()">
Load Students
</button>

<div id="usersList"></div>

</div>

<script type="module" src="admin.js"></script>

<!-- 🔥 FIX: auto load list on open -->
<script>
window.addEventListener("load", () => {
  setTimeout(() => {
    if(typeof loadCodes === "function"){
      loadCodes();
    }
  }, 1000);
});
</script>

</body>
</html>
