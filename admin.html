<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
<h1>Admin Panel</h1>

<input type="text" id="videoLink" placeholder="Paste Video Link">

<button onclick="saveVideo()">Save Video</button>

<p id="status"></p>
</div>

<script>
function saveVideo(){

let link = document.getElementById('videoLink').value;

localStorage.setItem('video', link);

document.getElementById('status').innerHTML = 'Saved';

}
</script>

</body>
</html>
