<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Education Platform Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f0f0f,#1b1b3a,#000000);
overflow:hidden;
position:relative;
transition:0.5s;
}

/* LOADER */

#loader{
position:fixed;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
animation:hideLoader 2s forwards;
}

.spinner{
width:60px;
height:60px;
border:5px solid #333;
border-top:5px solid #5b5bff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

@keyframes hideLoader{
0%,90%{
opacity:1;
visibility:visible;
}
100%{
opacity:0;
visibility:hidden;
}
}

/* PARTICLES */

#particles{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
z-index:0;
}

.particle{
position:absolute;
width:5px;
height:5px;
background:white;
border-radius:50%;
opacity:0.3;
animation:moveParticle linear infinite;
}

@keyframes moveParticle{

from{
transform:translateY(100vh);
}

to{
transform:translateY(-10vh);
}

}

/* BACKGROUND CIRCLES */

.circle{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,0.05);
animation:float 8s infinite ease-in-out;
}

.circle:nth-child(1){
width:220px;
height:220px;
top:-50px;
left:-50px;
}

.circle:nth-child(2){
width:300px;
height:300px;
bottom:-100px;
right:-100px;
animation-delay:2s;
}

@keyframes float{
0%{
transform:translateY(0px);
}
50%{
transform:translateY(20px);
}
100%{
transform:translateY(0px);
}
}

/* LOGIN BOX */

.login-box{
position:relative;
width:90%;
max-width:400px;
padding:30px;
background:rgba(20,20,20,0.9);
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 0 25px rgba(0,0,0,0.6);
z-index:2;
}

/* PROFILE ICON */

.profile-icon{
width:70px;
height:70px;
border-radius:50%;
background:linear-gradient(135deg,#5b5bff,#7d5fff);
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
margin:auto;
margin-bottom:15px;
box-shadow:0 0 20px rgba(91,91,255,0.5);
}

/* LOGO */

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:10px;
color:white;
}

/* TYPING */

.typing{
text-align:center;
font-size:14px;
color:#00ffcc;
height:20px;
margin-bottom:15px;
}

/* SUBTITLE */

.subtitle{
text-align:center;
font-size:14px;
color:#aaa;
margin-bottom:25px;
}

/* INPUT */

.input-box{
margin-top:15px;
}

.input-box input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#2b2b2b;
color:white;
font-size:15px;
outline:none;
}

.input-box input:focus{
border:1px solid #5b5bff;
}

/* BUTTON */

.login-btn{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#5b5bff,#7d5fff);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
box-shadow:0 0 15px rgba(91,91,255,0.5);
}

.login-btn:hover{
transform:scale(1.03);
opacity:0.95;
box-shadow:0 0 25px rgba(91,91,255,0.8);
}

/* MESSAGE */

#msg{
margin-top:15px;
text-align:center;
color:#ff5c5c;
font-size:14px;
}

/* FOOTER */

.footer{
margin-top:20px;
text-align:center;
font-size:12px;
color:gray;
}

</style>

</head>

<body>

<!-- LOADER -->

<div id="loader">
<div class="spinner"></div>
</div>

<!-- PARTICLES -->

<div id="particles"></div>

<!-- CIRCLES -->

<div class="circle"></div>
<div class="circle"></div>

<!-- LOGIN BOX -->

<div class="login-box">

<div class="profile-icon">🎓</div>

<div class="typing" id="typing"></div>

<div class="logo">📚 Education Platform</div>

<div class="subtitle">
Secure Student Login System
</div>

<!-- EMAIL -->

<div class="input-box">
<input type="email" id="email" placeholder="Enter Email">
</div>

<!-- PASSWORD -->

<div class="input-box">
<input type="password" id="password" placeholder="Enter Password">
</div>

<!-- ACCESS CODE -->

<div class="input-box">
<input type="text" id="code" placeholder="Enter Access Code">
</div>

<!-- BUTTON -->

<button class="login-btn" onclick="login()">
Login
</button>

<!-- MESSAGE -->

<p id="msg"></p>

<!-- FOOTER -->

<div class="footer">
Powered by Firebase Secure System
</div>

</div>

<!-- FIREBASE LOGIN SCRIPT -->

<script type="module" src="script.js"></script>

<!-- EFFECTS SCRIPT -->

<script>

// PARTICLES

const particles = document.getElementById('particles');

for(let i=0;i<50;i++){

const p = document.createElement('div');

p.classList.add('particle');

p.style.left = Math.random()*100 + 'vw';

p.style.animationDuration = (5 + Math.random()*10) + 's';

p.style.opacity = Math.random();

particles.appendChild(p);

}

// TYPING EFFECT

const texts = [
'Secure Student Access',
'Premium Learning Platform',
'Powered by Firebase',
'Professional Education System'
];

let count = 0;
let index = 0;
let currentText = '';
let letter = '';

(function type(){

if(count === texts.length){
count = 0;
}

currentText = texts[count];

letter = currentText.slice(0, ++index);

document.getElementById('typing').textContent = letter;

if(letter.length === currentText.length){

count++;
index = 0;

setTimeout(type,1500);

}else{

setTimeout(type,80);

}

})();

// PAGE TRANSITION

window.addEventListener('beforeunload',()=>{

document.body.style.opacity='0.5';

});

</script>

</body>
</html>
